services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iris
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      IRIS_DATABASE_URL: postgresql+asyncpg://iris:${POSTGRES_PASSWORD:-local-development-only}@database:5432/iris
      IRIS_STORAGE_BACKEND: local
      IRIS_STORAGE_PATH: /app/data
      IRIS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - image-data:/app/data
    depends_on:
      database:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  postgres-data:
  image-data: