[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iris-isolation-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "azure-identity>=1.24,<2",
  "azure-storage-blob>=12.26,<13",
  "fastapi>=0.116,<1",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
  "pillow>=11.3,<13",
  "pydantic-settings>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
ml = ["torch>=2.7,<3", "torchvision>=0.22,<1"]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "app.vercel:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
